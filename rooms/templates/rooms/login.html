
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Вход — MeetingRoomBooking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #1e293b;
        }
        main {
            max-width: 420px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .errorlist { color: #dc2626; }
    </style>
</head>
<body>
<main>
    <h1>Вход в аккаунт</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
    </form>

    <p>
        Нет аккаунта?
        <a href="{% url 'register' %}">Регистрация</a>
    </p>
</main>
</body>
</html>
