
services:
  db:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetingroom}
      POSTGRES_USER: ${POSTGRES_USER:-meetingroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    mem_limit: 1g
    cpus: 1.0
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 96mb, --maxmemory-policy, allkeys-lru]
    networks: [backend]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    image: meetingroom-app:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      DJANGO_READ_DOT_ENV: 'false'
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TRUST_PROXY: 'true'
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-meetingroom}
      POSTGRES_USER: ${POSTGRES_USER:-meetingroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_URL: redis://redis:6379/0
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:8080']
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx-locations.conf:/etc/nginx/locations.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/proxy-health]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  backend:
    internal: true
  frontend:
volumes:
  postgres_data:
  static_data:
  media_data:
