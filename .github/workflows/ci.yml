name: Checks and container verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    # Match the published setup-python artifacts for Python 3.14.2.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_DB: booking_tests
          POSTGRES_USER: booking_tests
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U booking_tests -d booking_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DJANGO_READ_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Unit tests for k6 summary normalization
        run: python scripts/test_k6_summary.py
      - run: python -m ruff check .
      - run: python scripts/check_format.py
      - name: Diff whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --check "$BASE" HEAD
          else
            git show --format= --check HEAD
          fi
      - run: python manage.py check --settings=config.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=config.test_postgres_settings
      - run: python manage.py test --noinput --settings=config.test_settings
      - name: HTTP E2E fixture and session regressions
        run: python manage.py test scripts.test_e2e_http --noinput --settings=config.test_settings
      - run: python -m coverage run manage.py test --noinput --settings=config.test_postgres_settings
      - run: python scripts/check_coverage.py
      - name: Redis round trip (not business storage)
        run: python -c "import redis; r=redis.Redis(host='127.0.0.1',port=56379); r.set('ci-health','ok',ex=10); assert r.get('ci-health')==b'ok'; r.delete('ci-health')"
  container:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          target: test
          tags: meetingroom-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start isolated dependencies
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml up -d --wait db redis
      - name: Explicit migration on the new CI database
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml run --rm --no-deps app python manage.py migrate --noinput
      - name: Start application and proxy
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml up -d --wait --wait-timeout 120
      - name: HTTP and cache readiness
        run: python scripts/infra_probe.py
      - name: Dependency failure, recovery and persistent history
        run: python scripts/verify_infrastructure.py --project mrb-ci
      - name: Real HTTP end-to-end scenarios
        run: python scripts/e2e_http.py --project mrb-ci
      - name: PostgreSQL suite inside the image
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml exec -T app python manage.py test --noinput --settings=config.test_container_settings
      - name: Start local observability stack
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml -f compose.monitoring.yaml up -d --wait prometheus alertmanager grafana
      - name: Validate isolated k6 Compose profile
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml -f compose.monitoring.yaml -f compose.load.yaml config --quiet
      - name: Verify PostgreSQL metrics, Grafana dashboard and Alertmanager
        run: python scripts/verify_monitoring.py --project mrb-ci
      - name: Run isolated 1000-VU read-only load test
        id: k6_load_test
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml -f compose.monitoring.yaml -f compose.load.yaml run --rm k6
      - name: Normalize and validate k6 JSON summary
        if: ${{ always() && steps.k6_load_test.outcome != 'skipped' }}
        run: python scripts/normalize_k6_summary.py
      - name: Upload k6 load-test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrb-k6-load-summary
          path: |
            reports/k6-summary.json
            reports/k6-summary-readable.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build production runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          target: production
          tags: meetingroom-app:production
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export production Docker image
        run: |
          test "$(docker image inspect meetingroom-app:production --format '{{.Config.User}}')" = "10001:10001"
          docker save meetingroom-app:production -o meetingroom-production-image.tar
      - name: Upload production Docker image
        uses: actions/upload-artifact@v4
        with:
          name: meetingroom-production-image
          path: meetingroom-production-image.tar
          if-no-files-found: error
          retention-days: 30
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml -f compose.monitoring.yaml logs --tail=80
      - name: Stop without deleting containers or volumes
        if: always()
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml -f compose.monitoring.yaml stop
