name: Checks and container verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    # Match the published setup-python artifacts for Python 3.14.2.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_DB: booking_tests
          POSTGRES_USER: booking_tests
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U booking_tests -d booking_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DJANGO_READ_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python scripts/check_format.py
      - name: Diff whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --check "$BASE" HEAD
          else
            git show --format= --check HEAD
          fi
      - run: python manage.py check --settings=config.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=config.test_postgres_settings
      - run: python manage.py test --noinput --settings=config.test_settings
      - run: python -m coverage run manage.py test --noinput --settings=config.test_postgres_settings
      - run: python scripts/check_coverage.py
      - name: Redis round trip (not business storage)
        run: python -c "import redis; r=redis.Redis(host='127.0.0.1',port=56379); r.set('ci-health','ok',ex=10); assert r.get('ci-health')==b'ok'; r.delete('ci-health')"
  container:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          target: test
          tags: meetingroom-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start isolated dependencies
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml up -d --wait db redis
      - name: Explicit migration on the new CI database
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml run --rm --no-deps app python manage.py migrate --noinput
      - name: Start application and proxy
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml up -d --wait --wait-timeout 120
      - name: HTTP and cache readiness
        run: python scripts/infra_probe.py
      - name: Dependency failure, recovery and persistent history
        run: python scripts/verify_infrastructure.py --project mrb-ci
      - name: Real HTTP end-to-end scenarios
        run: python scripts/e2e_http.py --project mrb-ci
      - name: PostgreSQL suite inside the image
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml exec -T app python manage.py test --noinput --settings=config.test_container_settings
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml logs --tail=80
      - name: Stop without deleting containers or volumes
        if: always()
        run: docker compose --env-file docker/test.env -p mrb-ci -f compose.yaml -f compose.test.yaml stop
