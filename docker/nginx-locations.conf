location = /proxy-health { return 200 'ok'; access_log off; }
location = /metrics/ { return 404; }
location /static/ {
    alias /srv/static/;
    add_header X-Content-Type-Options nosniff always;
}
location /media/ {
    alias /srv/media/;
    types { image/jpeg jpg jpeg; image/png png; image/webp webp; image/gif gif; }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Content-Disposition inline always;
}
location / {
    set $backend app:8000;
    proxy_pass http://$backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Always replace untrusted headers, including on the plain HTTP listener.
    proxy_set_header X-Forwarded-Proto $scheme;
}
