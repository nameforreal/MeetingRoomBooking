# Real certificates must be supplied separately. Never use test.env in production.
services:
  app:
    environment:
      DJANGO_ENV: production
  proxy:
    ports: !override
      - '127.0.0.1:${HTTP_PORT:-8080}:8080'
      - '${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443'
    volumes:
      - ./docker/nginx-production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/tls:/etc/nginx/tls:ro
